  <script>
    const svg = document.getElementById("map");
    const tooltip = document.getElementById("tooltip");
    const original = { x: 0, y: 0, w: 900, h: 980 };
    let viewBox = { ...original };
    let dragging = false;
    let start = null;
    function setViewBox() { svg.setAttribute("viewBox", [viewBox.x, viewBox.y, viewBox.w, viewBox.h].join(" ")); }
    function zoom(factor, clientX = window.innerWidth / 2, clientY = window.innerHeight / 2) {
      const rect = svg.getBoundingClientRect();
      const mx = viewBox.x + ((clientX - rect.left) / rect.width) * viewBox.w;
      const my = viewBox.y + ((clientY - rect.top) / rect.height) * viewBox.h;
      const nw = viewBox.w * factor;
      const nh = viewBox.h * factor;
      viewBox.x = mx - ((mx - viewBox.x) / viewBox.w) * nw;
      viewBox.y = my - ((my - viewBox.y) / viewBox.h) * nh;
      viewBox.w = nw;
      viewBox.h = nh;
      setViewBox();
    }
    document.getElementById("zoom-in").addEventListener("click", () => zoom(0.8));
    document.getElementById("zoom-out").addEventListener("click", () => zoom(1.25));
    document.getElementById("reset").addEventListener("click", () => { viewBox = { ...original }; setViewBox(); });
    svg.addEventListener("wheel", (event) => { event.preventDefault(); zoom(event.deltaY < 0 ? 0.86 : 1.16, event.clientX, event.clientY); }, { passive: false });
    svg.addEventListener("pointerdown", (event) => {
      dragging = true; svg.classList.add("dragging");
      start = { x: event.clientX, y: event.clientY, vb: { ...viewBox } };
      svg.setPointerCapture(event.pointerId);
    });
    svg.addEventListener("pointermove", (event) => {
      if (dragging && start) {
        const rect = svg.getBoundingClientRect();
        viewBox.x = start.vb.x - ((event.clientX - start.x) / rect.width) * start.vb.w;
        viewBox.y = start.vb.y - ((event.clientY - start.y) / rect.height) * start.vb.h;
        setViewBox();
      }
      const target = event.target.closest(".county");
      if (target) {
        tooltip.textContent = target.dataset.city + ": " + Number(target.dataset.count).toLocaleString("zh-TW") + " 人";
        tooltip.style.left = event.clientX + "px";
        tooltip.style.top = event.clientY + "px";
        tooltip.style.opacity = 1;
      } else {
        tooltip.style.opacity = 0;
      }
    });
    svg.addEventListener("pointerup", () => { dragging = false; svg.classList.remove("dragging"); });
    svg.addEventListener("pointerleave", () => { dragging = false; svg.classList.remove("dragging"); tooltip.style.opacity = 0; });
  </script>
